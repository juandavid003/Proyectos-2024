<div *ngIf="isLoggedIn" class="edit-form-container">
    <form (ngSubmit)="createTreatment()">
      <!-- Campo para la descripción del tratamiento -->
      <div class="form-group">
        <label for="description">Descripción:</label>
        <input
          type="text"
          id="description"
          [(ngModel)]="newTreatment.description"
          name="description"
          required
          class="form-control"
        />
      </div>
  
      <!-- Campo para la fecha de inicio -->
      <div class="form-group">
        <label for="startDate">Fecha de Inicio:</label>
        <input
          type="date"
          id="startDate"
          [(ngModel)]="newTreatment.startDate"
          name="startDate"
          required
          class="form-control"
        />
      </div>
  
      <!-- Campo para la fecha de fin -->
      <div class="form-group">
        <label for="endDate">Fecha de Fin:</label>
        <input
          type="date"
          id="endDate"
          [(ngModel)]="newTreatment.endDate"
          name="endDate"
          required
          class="form-control"
        />
      </div>
  
      <!-- Campo para el costo estándar -->
      <div class="form-group">
        <label for="standardCost">Costo Estándar:</label>
        <input
          type="number"
          id="standardCost"
          [(ngModel)]="newTreatment.standardCost"
          name="standardCost"
          required
          min="0"
          class="form-control"
        />
      </div>
  
      <!-- Campo para el consumo estándar -->
      <div class="form-group">
        <label for="standardConsumption">Consumo Estándar:</label>
        <input
          type="number"
          id="standardConsumption"
          [(ngModel)]="newTreatment.standardConsumption"
          name="standardConsumption"
          required
          min="0"
          class="form-control"
        />
      </div>
  
      <!-- Campo para seleccionar el paciente -->
      <div class="form-group">
        <label for="patientId">Paciente:</label>
        <select
          id="patientId"
          [(ngModel)]="newTreatment.patientId"
          name="patientId"
          required
          class="form-control"
        >
        <option *ngFor="let patient of allPatients" [value]="patient.id">
            {{ patient.firstName + ' ' + patient.lastName }}
          </option>
       </select>
      </div>
  
      <!-- Campo para seleccionar la especialidad -->
      <div class="form-group">
        <label for="especialityId">Especialidad:</label>
        <select
          id="specialistId"
          name="specialistId"
          required
          class="form-control"
          (change)="onEspecialityChange($event)"
        >
          <option *ngFor="let especiality of allEspecialities" [value]="especiality.Id">
            {{ especiality.Name }}
          </option>
        </select>
      </div>
      


      <!-- Campo para seleccionar el especialista -->
      <div class="form-group">
        <label for="specialistId">Especialista:</label>
        <select
          id="specialistId"
          [(ngModel)]="newTreatment.specialistId"
          name="specialistId"
          required
          class="form-control"
        >
          <option *ngFor="let specialist of allSpecialistsOfEspeciality" [value]="specialist.id">
            {{ specialist.firstName + ' ' + specialist.lastName }}
          </option>
        </select>
      </div>
  
      <!-- Campo para el administrador -->
      <div class="form-group">
        <label for="adminId">Administrador:</label>
        <input
          type="number"
          id="adminId"
          [(ngModel)]="newTreatment.adminId"
          name="adminId"
          required
          class="form-control"
        />
      </div>
  
      <!-- Botón para crear el tratamiento -->
      <button type="submit" class="btn btn-primary">Crear Tratamiento</button>
    </form>
  </div>
  
  <div *ngIf="!isLoggedIn" class="alert alert-warning">
    <p>No tienes permiso para ver esta página. Por favor, inicia sesión.</p>
  </div>
